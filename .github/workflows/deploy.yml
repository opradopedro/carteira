name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Atualiza as cotações públicas (horário UTC; Brasília = UTC-3):
    # 21h41 depois do fechamento da B3, 7h41 quando sai o CSV do Tesouro e, em dias úteis,
    # 10h41, 13h41 e 16h41 para pegar o preço do dia do Tesouro Direto.
    - cron: '41 0,10 * * *'
    - cron: '41 13,16,19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # O GitHub roda os agendamentos na branch padrão do repositório; o Pages só publica a partir da main.
  # Se a branch padrão não for a main, o agendamento só dispara a publicação na main.
  redirecionar:
    if: github.event_name == 'schedule' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Gerar cotações históricas públicas
        run: node scripts/build-data.mjs
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
